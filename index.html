
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文字数カウント</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f4f6f9;
      color: #283548;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans JP", Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border: 1px solid #e8ecf2;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(30, 50, 80, 0.05);
    }

    /* タイトル：シンプルなアクセントライン */
    h1 {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 0 26px;
      color: #26364a;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.4;
    }

    h1::before {
      content: "";
      display: block;
      flex: 0 0 5px;
      height: 29px;
      background: #4a80c2;
      border-radius: 3px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 260px;
      padding: 15px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #fff;
      color: #283548;
      font-family: inherit;
      font-size: 16px;
      line-height: 1.8;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: #719bd0;
      outline: none;
      box-shadow: 0 0 0 3px rgba(74, 128, 194, 0.12);
    }

    .controls {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .action-button {
      min-width: 100px;
      padding: 10px 20px;
      border: 1px solid #d5dce6;
      border-radius: 7px;
      background: #fff;
      color: #34445a;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .action-button:hover {
      background: #f3f6fa;
      border-color: #aebed1;
    }

    .paste-button {
      border-color: #426fa9;
      background: #426fa9;
      color: #fff;
    }

    .paste-button:hover {
      border-color: #345c90;
      background: #345c90;
      color: #fff;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 26px;
    }

    .result-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 18px;
      border: 1px solid #e5eaf1;
      border-radius: 8px;
      background: #f8fafd;
    }

    .result-label {
      color: #5d6b7d;
      font-size: 14px;
    }

    .result-value {
      color: #26364a;
      font-size: 27px;
      font-weight: 700;
      text-align: right;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      margin-left: 4px;
      color: #7b8796;
      font-size: 12px;
      font-weight: 400;
    }

    /* 手動ペースト用ダイアログ */
    .paste-dialog[hidden] {
      display: none !important;
    }

    .paste-dialog {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(26, 39, 56, 0.48);
    }

    .dialog-panel {
      width: 100%;
      max-width: 520px;
      padding: 24px;
      border: 1px solid #e5eaf1;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.16);
    }

    .dialog-panel h2 {
      margin: 0 0 12px;
      font-size: 19px;
    }

    .dialog-description {
      margin: 0 0 14px;
      color: #647286;
      font-size: 14px;
      line-height: 1.8;
    }

    .dialog-panel textarea {
      min-height: 160px;
      font-size: 14px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .dialog-status {
      min-height: 1.5em;
      margin-top: 8px;
      color: #b54747;
      font-size: 13px;
    }

    @media (max-width: 560px) {
      body {
        padding: 12px 8px;
      }

      .container {
        padding: 18px;
      }

      h1 {
        font-size: 23px;
      }

      .results {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 220px;
      }

      .controls {
        justify-content: stretch;
      }

      .action-button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- タイトル -->
    <h1>文字数カウント</h1>

    <!-- 文章入力欄 -->
    <textarea
      id="textInput"
      placeholder="カウントしたい文章を入力または貼り付けてください。"
      aria-label="カウントする文章"
    ></textarea>

    <!-- ペースト・コピー -->
    <div class="controls">
      <button
        type="button"
        id="pasteButton"
        class="action-button paste-button"
      >
        ペースト
      </button>

      <button
        type="button"
        id="copyButton"
        class="action-button"
      >
        コピー
      </button>
    </div>

    <!-- カウント結果 -->
    <section class="results" aria-label="カウント結果">

      <div class="result-card">
        <span class="result-label">文字数</span>
        <span class="result-value">
          <span id="count">0</span>
          <span class="unit">文字</span>
        </span>
      </div>

      <div class="result-card">
        <span class="result-label">改行除く</span>
        <span class="result-value">
          <span id="withoutCrCount">0</span>
          <span class="unit">文字</span>
        </span>
      </div>

      <div class="result-card">
        <span class="result-label">改行・空白除く</span>
        <span class="result-value">
          <span id="withoutCrSpaceCount">0</span>
          <span class="unit">文字</span>
        </span>
      </div>

      <div class="result-card">
        <span class="result-label">行数</span>
        <span class="result-value">
          <span id="lines">0</span>
          <span class="unit">行</span>
        </span>
      </div>

    </section>
  </main>

  <!-- 自動ペーストできない場合の入力画面 -->
  <div
    id="pasteDialog"
    class="paste-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogTitle"
    hidden
  >
    <div class="dialog-panel">
      <h2 id="dialogTitle">文章を貼り付け</h2>

      <p class="dialog-description">
        ブラウザの制限によりクリップボードを自動で読み取れませんでした。<br>
        下の欄をクリックし、Ctrl + V（Macは ⌘ + V）で貼り付けてください。
      </p>

      <textarea
        id="manualPasteInput"
        placeholder="ここをクリックして、文章を貼り付けてください。"
        aria-label="貼り付け用の入力欄"
      ></textarea>

      <div id="dialogStatus" class="dialog-status" aria-live="polite"></div>

      <div class="dialog-actions">
        <button
          type="button"
          id="cancelPasteButton"
          class="action-button"
        >
          キャンセル
        </button>

        <button
          type="button"
          id="applyPasteButton"
          class="action-button paste-button"
        >
          入力欄に反映
        </button>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById("textInput");
    const pasteButton = document.getElementById("pasteButton");
    const copyButton = document.getElementById("copyButton");

    const pasteDialog = document.getElementById("pasteDialog");
    const manualPasteInput = document.getElementById("manualPasteInput");
    const applyPasteButton = document.getElementById("applyPasteButton");
    const cancelPasteButton = document.getElementById("cancelPasteButton");
    const dialogStatus = document.getElementById("dialogStatus");

    // 改行コードを統一
    function normalizeLineBreaks(text) {
      return text.replace(/\r\n?/g, "\n");
    }

    // Unicodeコードポイント単位で文字数をカウント
    function countCharacters(text) {
      return Array.from(text).length;
    }

    // カウント結果を更新
    function updateCounts() {
      const text = normalizeLineBreaks(textInput.value);

      // 文字数（改行を含む）
      document.getElementById("count").textContent =
        countCharacters(text);

      // 改行を除く
      const withoutNewlines = text.replace(/\n/g, "");

      document.getElementById("withoutCrCount").textContent =
        countCharacters(withoutNewlines);

      // 改行・半角空白・タブ・全角空白を除く
      const withoutNewlinesAndSpaces =
        text.replace(/[\n \t\u3000]/g, "");

      document.getElementById("withoutCrSpaceCount").textContent =
        countCharacters(withoutNewlinesAndSpaces);

      // 空欄は0行、それ以外は改行で分割して数える
      const lineCount = text.length === 0
        ? 0
        : text.split("\n").length;

      document.getElementById("lines").textContent = lineCount;
    }

    // 入力・ペースト・編集を常にリアルタイムでカウント
    textInput.addEventListener("input", updateCounts);

    // 入力欄に文章を反映
    function applyText(text) {
      textInput.value = text;
      updateCounts();
      textInput.focus();
      textInput.setSelectionRange(
        textInput.value.length,
        textInput.value.length
      );
    }

    // ボタン表示を一時変更
    function showTemporaryLabel(button, label, originalLabel) {
      button.textContent = label;

      setTimeout(function () {
        button.textContent = originalLabel;
      }, 1500);
    }

    // 手動ペースト画面を表示
    function openPasteDialog() {
      manualPasteInput.value = "";
      dialogStatus.textContent = "";
      pasteDialog.hidden = false;

      setTimeout(function () {
        manualPasteInput.focus();
      }, 50);
    }

    // ペーストボタン
    pasteButton.addEventListener("click", async function () {
      // Clipboard APIによる自動ペーストを試す
      try {
        if (
          !navigator.clipboard ||
          typeof navigator.clipboard.readText !== "function"
        ) {
          throw new Error("Clipboard API is unavailable");
        }

        const clipboardText = await navigator.clipboard.readText();

        applyText(clipboardText);

        showTemporaryLabel(
          pasteButton,
          "貼り付けました",
          "ペースト"
        );

      } catch (error) {
        // 自動読み取りできない環境では手動入力画面を開く
        openPasteDialog();
      }
    });

    // 手動ペーストした文章を入力欄へ反映
    applyPasteButton.addEventListener("click", function () {
      applyText(manualPasteInput.value);
      pasteDialog.hidden = true;

      showTemporaryLabel(
        pasteButton,
        "貼り付けました",
        "ペースト"
      );
    });

    // Enterではなく、Ctrl+Enter / Cmd+Enterで反映する
    manualPasteInput.addEventListener("keydown", function (event) {
      if (
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
      ) {
        event.preventDefault();
        applyPasteButton.click();
      }

      if (event.key === "Escape") {
        pasteDialog.hidden = true;
        textInput.focus();
      }
    });

    // ペースト画面を閉じる
    cancelPasteButton.addEventListener("click", function () {
      pasteDialog.hidden = true;
      textInput.focus();
    });

    // 背景部分をクリックして閉じる
    pasteDialog.addEventListener("click", function (event) {
      if (event.target === pasteDialog) {
        pasteDialog.hidden = true;
        textInput.focus();
      }
    });

    // クリップボードへコピー
    copyButton.addEventListener("click", async function () {
      const text = textInput.value;

      try {
        if (
          !navigator.clipboard ||
          typeof navigator.clipboard.writeText !== "function"
        ) {
          throw new Error("Clipboard API is unavailable");
        }

        await navigator.clipboard.writeText(text);

        showTemporaryLabel(
          copyButton,
          "コピーしました",
          "コピー"
        );

      } catch (error) {
        // 代替処理：文章を選択して手動コピーできる状態にする
        textInput.focus();
        textInput.select();

        const copied = document.execCommand("copy");

        if (copied) {
          showTemporaryLabel(
            copyButton,
            "コピーしました",
            "コピー"
          );
        } else {
          alert(
            "自動コピーできませんでした。\n" +
            "選択されている文章を手動でコピーしてください。"
          );
        }
      }
    });

    // 初期表示
    updateCounts();
  </script>
</body>
</html>
